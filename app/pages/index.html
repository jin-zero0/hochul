<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민간구급차 플랫폼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .loading-container {
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        .title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="logo">
            <i class="bi bi-truck-front"></i>
        </div>
        <div class="title">민간구급차 플랫폼</div>
        <div class="subtitle">안전하고 빠른 응급의료 서비스</div>
        <div class="spinner"></div>
    </div>

    <script>
        // 페이지 로드 시 로그인 상태 확인 후 적절한 페이지로 이동
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const appType = localStorage.getItem('appType');
            
            setTimeout(() => {
                if (isLoggedIn === 'true' && appType) {
                    // 이미 로그인된 상태라면 해당 앱으로 이동
                    if (appType === 'customer') {
                        window.location.href = 'app/pages/home.html';
                    } else if (appType === 'driver') {
                        window.location.href = 'app/pages/driver.html';
                    } else {
                        window.location.href = 'app/pages/login.html';
                    }
                } else {
                    // 로그인되지 않은 상태라면 로그인 페이지로 이동
                    window.location.href = 'app/pages/login.html';
                }
            }, 2000); // 2초 후 이동
        };
    </script>
</body>
</html>
