<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }
        
        body {
            background-color: #f8f9fa;
            color: #333;
            height: 100vh;
            overflow: hidden;
        }
        
        .mobile-container {
            position: relative;
            width: 411px;
            height: 731px;
            margin: 20px auto;
            background-color: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }
        
        /* 작은 Android 화면 (360x640) 대응 */
        @media (max-width: 411px) {
            .mobile-container {
                width: 360px;
                height: 640px;
                margin: 10px auto;
                border-radius: 20px;
            }
            
            .header {
                padding: 12px 16px;
                height: 50px;
            }
            
            .content {
                height: calc(100% - 50px - 60px);
            }
            
            .profile-section {
                padding: 15px;
                margin-bottom: 10px;
            }
            
            .profile-avatar {
                width: 60px;
                height: 60px;
            }
            
            .profile-name {
                font-size: 16px;
            }
            
            .profile-phone {
                font-size: 12px;
            }
        }
        
        /* 상단 헤더 */
        .header {
            background-color: white;
            color: #333;
            padding: 15px 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        /* 메인 컨텐츠 */
        .content {
            height: calc(100% - 60px - 80px); /* 전체 높이 - 헤더 - 하단 네비게이션 */
            overflow-y: auto;
            background-color: #f2f2f7;
        }
        
        /* 프로필 섹션 */
        .profile-section {
            background-color: white;
            padding: 20px;
            margin-bottom: 15px;
        }
        
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .profile-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            overflow: hidden;
        }
        
        .profile-avatar i {
            font-size: 36px;
            color: #bbb;
        }
        
        .profile-info {
            flex: 1;
        }
        
        .profile-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .profile-phone {
            font-size: 14px;
            color: #8e8e93;
        }
        
        .edit-profile-btn {
            background-color: #f2f2f7;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }
        
        /* 메뉴 리스트 */
        .menu-list {
            list-style: none;
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        
        .menu-item:last-child {
            border-bottom: none;
        }
        
        .menu-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }
        
        .menu-icon.red {
            background-color: #ffebee;
            color: #ff3b30;
        }
        
        .menu-icon.blue {
            background-color: #e3f2fd;
            color: #007aff;
        }
        
        .menu-icon.green {
            background-color: #e8f5e9;
            color: #34c759;
        }
        
        .menu-icon.purple {
            background-color: #f3e5f5;
            color: #9c27b0;
        }
        
        .menu-icon.orange {
            background-color: #fff3e0;
            color: #ff9500;
        }
        
        .menu-icon i {
            font-size: 16px;
        }
        
        .menu-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .menu-title {
            font-size: 16px;
        }
        
        .menu-arrow {
            color: #c7c7cc;
        }
        
        .menu-value {
            font-size: 14px;
            color: #8e8e93;
        }
        
        /* 로그아웃 버튼 */
        .logout-btn {
            background: none;
            border: none;
            width: 100%;
            text-align: center;
            padding: 15px 0;
            color: #ff3b30;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
        }
        
        /* 하단 네비게이션 */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e9ecef;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 12px;
        }
        
        .nav-item.active {
            color: #ff3b30;
        }
        
        .nav-item i {
            font-size: 22px;
            margin-bottom: 5px;
        }
        
        /* 토글 스위치 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #e4e4e4;
            transition: .4s;
            border-radius: 34px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #34c759;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 상단 헤더 -->
        <div class="header">
            <h1>프로필</h1>
        </div>
        
        <!-- 메인 컨텐츠 -->
        <div class="content">
            <!-- 프로필 섹션 -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-info">
                        <div class="profile-name">홍길동</div>
                        <div class="profile-phone">010-1234-5678</div>
                    </div>
                    <button class="edit-profile-btn">
                        <i class="fas fa-pencil-alt"></i> 수정
                    </button>
                </div>
            </div>
            
            <!-- 계정 설정 -->
            <div class="profile-section">
                <h2 style="font-size: 16px; margin-bottom: 15px;">계정 설정</h2>
                <ul class="menu-list">
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">개인정보 관리</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon green">
                            <i class="fas fa-bell"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">알림 설정</div>
                            <label class="toggle-switch">
                                <input type="checkbox" checked>
                                <span class="toggle-slider"></span>
                            </label>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon purple">
                            <i class="fas fa-credit-card"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">결제 수단 관리</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                </ul>
            </div>
            
            <!-- 의료 정보 -->
            <div class="profile-section">
                <h2 style="font-size: 16px; margin-bottom: 15px;">의료 정보</h2>
                <ul class="menu-list">
                    <li class="menu-item">
                        <div class="menu-icon red">
                            <i class="fas fa-heartbeat"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">기본 의료 정보</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon orange">
                            <i class="fas fa-hospital"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">자주 가는 병원</div>
                            <div class="menu-value">2개 등록됨</div>
                        </div>
                    </li>
                </ul>
            </div>
            
            <!-- 고객지원 -->
            <div class="profile-section">
                <h2 style="font-size: 16px; margin-bottom: 15px;">고객지원</h2>
                <ul class="menu-list">
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-question-circle"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">자주 묻는 질문</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-headset"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">고객센터</div>
                            <div class="menu-value">1588-1234</div>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">이용약관</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">개인정보 처리방침</div>
                            <i class="fas fa-chevron-right menu-arrow"></i>
                        </div>
                    </li>
                </ul>
            </div>
            
            <!-- 앱 정보 -->
            <div class="profile-section">
                <ul class="menu-list">
                    <li class="menu-item">
                        <div class="menu-icon blue">
                            <i class="fas fa-info-circle"></i>
                        </div>
                        <div class="menu-content">
                            <div class="menu-title">앱 버전</div>
                            <div class="menu-value">1.0.0</div>
                        </div>
                    </li>
                </ul>
            </div>
            
            <!-- 로그아웃 -->
            <div class="profile-section">
                <button class="logout-btn">로그아웃</button>
            </div>
        </div>
        
        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <a href="home.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>홈</span>
            </a>
            <a href="history.html" class="nav-item">
                <i class="fas fa-history"></i>
                <span>이용내역</span>
            </a>
            <a href="reservation.html" class="nav-item">
                <i class="far fa-calendar-check"></i>
                <span>예약</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <i class="fas fa-user"></i>
                <span>프로필</span>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 프로필 수정 버튼
            const editProfileBtn = document.querySelector('.edit-profile-btn');
            editProfileBtn.addEventListener('click', function() {
                alert('프로필 수정 페이지로 이동합니다.');
            });
            
            // 메뉴 아이템 클릭 이벤트
            const menuItems = document.querySelectorAll('.menu-item');
            menuItems.forEach(item => {
                item.addEventListener('click', function() {
                    const title = this.querySelector('.menu-title').textContent;
                    if (!this.querySelector('.toggle-switch') && !this.querySelector('.menu-value')) {
                        alert(`${title} 페이지로 이동합니다.`);
                    }
                });
            });
            
            // 로그아웃 버튼
            const logoutBtn = document.querySelector('.logout-btn');
            logoutBtn.addEventListener('click', function() {
                if (confirm('정말 로그아웃 하시겠습니까?')) {
                    alert('로그아웃 되었습니다.');
                    // 실제로는 로그아웃 처리 후 로그인 페이지로 이동
                }
            });
        });
    </script>
</body>
</html>
